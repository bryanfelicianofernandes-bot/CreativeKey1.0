name: Build CreativeKey

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking repository contents..."
          ls -la
          if [ ! -f CreativeKey-source.zip ]; then
            echo "CreativeKey-source.zip not found"
            exit 1
          fi
          echo "ZIP found. The project must be extracted and its build files committed before compiling."
          
