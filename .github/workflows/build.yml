
name: Build CreativeKey

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extrair projeto
        run: unzip -q CreativeKey-source.zip -d project

      - name: Compilar CreativeKey
        shell: bash
        run: |
          BUILD_FILE=$(find project -type f -name build.gradle -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERRO: build.gradle nao encontrado"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          gradle -p "$PROJECT_DIR" build

      - name: Disponibilizar arquivos JAR
        uses: actions/upload-artifact@v4
        with:
          name: CreativeKey-JAR
          path: project/**/build/libs/*.jar
          if-no-files-found: error
          
