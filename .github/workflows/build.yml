
name: Build CreativeKey

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Extract project ZIP
        run: unzip -q CreativeKey-source.zip -d project

      - name: Find Gradle project
        run: |
          find project -type f \( -name gradlew -o -name build.gradle -o -name build.gradle.kts \)

      - name: Stop if project files are missing
        run: |
          if ! find project -type f \( -name gradlew -o -name build.gradle -o -name build.gradle.kts \) | grep -q .; then
            echo "Gradle build files not found in ZIP"
            exit 1
          fi
          
